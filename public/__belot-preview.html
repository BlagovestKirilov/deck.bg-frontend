<!doctype html>
<html lang="bg"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="/src/styles/belot.css?direct" />
<link rel="stylesheet" href="/src/styles/theme.css?direct" />
</head><body>
<main class="screen belot">
  <header class="belot__bar">
    <button class="belot__score">
      <span class="belot__score-col"><span class="belot__side">ние</span><span class="belot__points">0</span></span>
      <span class="belot__score-col"><span class="belot__side">вие</span><span class="belot__points">0</span></span>
      <span class="belot__declared"><span class="belot__suit belot__suit--red">♥</span><span class="belot__declared-by">player3</span></span>
    </button>
    <button class="round-btn round-btn--danger">X</button>
  </header>
  <div class="belot__table">
    <div class="belot__seat belot__seat--partner"><span class="belot__name">player3</span><span class="belot__backs"><span class="card-back"></span><span class="card-back"></span><span class="card-back"></span></span><span class="belot__announced"><span class="belot__announced-call">терца</span></span></div>
    <div class="belot__seat belot__seat--left"><span class="belot__name">player4</span><span class="belot__backs"><span class="card-back"></span><span class="card-back"></span></span><span class="belot__announced"><span class="belot__announced-call">терца</span><span class="belot__announced-call">белот</span></span></div>
    <div class="belot__seat belot__seat--right is-turn"><span class="belot__name">player2</span><span class="belot__backs"><span class="card-back"></span><span class="card-back"></span></span></div>
    <div class="belot__middle">
      <div class="belot__trick">
        <div class="belot__played">
          <p class="belot__count belot__count--corner">2/8</p>
          <span class="belot__played-card belot__played-card--partner"><span class="pcard" style="width:clamp(46px,12.5vw,72px);aspect-ratio:71/103;color:#16211a;"><span class="pcard__corner" style="align-self:flex-start;font-size:clamp(0.72rem,2.5vw,1.05rem)"><span>J</span><span>♠</span></span><span class="pcard__pip" style="font-size:clamp(1.2rem,4.4vw,1.9rem)">♠</span><span class="pcard__corner" style="align-self:flex-end;font-size:clamp(0.72rem,2.5vw,1.05rem);transform:rotate(180deg)"><span>J</span><span>♠</span></span></span></span>
        </div>
        <p class="belot__took">&nbsp;</p>
      </div>
    </div>
  </div>
  <section class="belot__hand">
    <div class="belot__hand-head"><p class="belot__you"><span class="belot__you-name">player1</span><span class="belot__announced"><span class="belot__announced-call">петдесет</span></span><span class="belot__tag">раздава</span></p>
    <span class="turn-pill"><span class="turn-pill__dot"></span><span>Чакаме player2</span><span class="belot__clock tabular">0с</span></span></div>
    <div class="belot__cards" id="cards"></div>
  </section>
</main>
<script>
const cards=[['J','♥'],['A','♥'],['K','♥'],['7','♥'],['10','♠'],['K','♠']];
document.getElementById('cards').innerHTML = cards.map(([r,su])=>{
  const red = su==='♥'||su==='♦';
  const c = 'clamp(0.82rem,3vw,1.25rem)';
  return `<span class="pcard" style="width:clamp(54px,15.5vw,86px);aspect-ratio:71/103;color:${red?'#c62828':'#16211a'}">
  <span class="pcard__corner" style="align-self:flex-start;font-size:${c}"><span>${r}</span><span>${su}</span></span>
  <span class="pcard__pip" style="font-size:clamp(1.45rem,5.4vw,2.3rem)">${su}</span>
  <span class="pcard__corner" style="align-self:flex-end;font-size:${c};transform:rotate(180deg)"><span>${r}</span><span>${su}</span></span></span>`;
}).join('');
</script>
</body></html>
