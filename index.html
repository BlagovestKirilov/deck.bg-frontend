<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <!-- The DECK.bg badge: favicon.ico carries 16, 32 and 48px for the tab;
       iOS takes the square apple-touch-icon for the home screen and rounds
       its corners itself; the manifest carries the rest. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <!-- viewport-fit=cover exposes the safe-area insets the layout pads with.
       Zoom is deliberately NOT disabled: blocking it fails WCAG 1.4.4. -->
  <!-- interactive-widget=resizes-content makes the on-screen keyboard shrink the
       layout viewport, so a focused input can be scrolled above it instead of
       being stranded underneath. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#08150e" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Класическо Сантасе (66) срещу реални опоненти." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Display + body faces. display=swap avoids invisible text; the system
       stack in theme.css carries the design if the fonts never arrive
       (offline Capacitor builds). Fredoka + Nunito dress the game tables;
       Sofia Sans (a Bulgarian design, with Bulgarian Cyrillic forms under
       lang="bg") dresses the lobby — sign-in, the hub and the profile. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Sofia+Sans:wght@400;500;600;700&family=Sofia+Sans+Extra+Condensed:wght@700;800&display=swap"
    rel="stylesheet"
  />

  <title>DECK.bg</title>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
