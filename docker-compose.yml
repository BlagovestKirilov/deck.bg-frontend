services:
  nginx_proxy:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  frontend:
    image: bkirilov/santase_frontend:latest
    container_name: santase_frontend
    restart: always

  backend:
    image: bkirilov/santase_backend:latest
    container_name: santase_backend
    restart: always
    env_file: .env